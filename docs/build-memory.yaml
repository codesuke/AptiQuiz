    changed_at: "2026-10-10"
    kind: "feature"
    title: "Question Set Authoring"
    status: "working_with_limitations"
    summary: "Hosts can create, edit, and reorder reusable Question Sets with text, image, and table Questions, use a shared read-only starter set, and take an immutable snapshot of a set for a Room."
    areas:
      - "question sets"
      - "database schema"
      - "web interface"
    working:
      - "A signed-in Host creates a Question Set with text, image-URL, and table Questions; the server rejects invalid options, correct answer, Topic, Difficulty, and media."
      - "A Host edits a Question and reorders the set at /question-sets/[setId]; invalid or foreign requests change nothing; concurrent writes to one set are serialised."
      - "One ownerless starter set is seeded idempotently, visible to every signed-in User and read-only."
      - "snapshotQuestionSet returns a deep-frozen ordered copy of an owned or starter set; later edits and reorders do not alter earlier snapshots, and a set can be snapshotted repeatedly."
    limitations:
      - "snapshotQuestionSet is not yet called; PRD #4 must call it at Room creation and persist the result."
      - "A set title cannot be renamed, and a set cannot be deleted or duplicated."
      - "The edit and reorder pages were not exercised in a browser."
