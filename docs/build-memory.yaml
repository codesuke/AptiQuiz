  - id: "2026-10-10-github-prd-1"
    changed_at: "2026-10-10"
    kind: "feature"
    title: "Accounts, Roles & Sign-in"
    status: "working_with_limitations"
    summary: "Added User accounts with email-and-password and Google sign-in, email verification, password reset, Admin role from ADMIN_EMAILS, suspension, and signed Socket Tickets so the Game Server identifies Users and Guests."
    areas:
      - "authentication"
      - "web interface"
      - "Game Server handshake"
      - "database schema"
    working:
      - "A visitor can sign up with display name, email, and password (8 to 128 characters), sign in, and sign out; the header shows Guest or signed-in state."
      - "Sign-up sends a verification email; following the link verifies the User; a signed-in unverified User sees a notice with a resend action limited to 3 per 5 minutes. Verification gates no page or action."
      - "Password reset sends a one-hour, single-use link; unknown emails get the same confirmation; a reset rejects the old password, ends other sessions, and marks the email verified; expired or used links show the expired-link page."
      - "Continue with Google signs in or creates a User when Google credentials are configured; it links to an existing password User only when that User's email is verified (approved spec change on #18)."
      - "A User is Admin only with a verified email in the trimmed, case-insensitive ADMIN_EMAILS list, computed per request; /admin redirects Guests to sign-in and shows Not allowed to other Users."
      - "A suspended User cannot sign in, existing sessions stop working on the next request, and POST /api/socket-ticket returns 403; without a session it returns 401."
      - "The browser requests a fresh 60-second HS256 Socket Ticket for every Game Server connection attempt; server:ready reports the User or Guest identity; bad tickets are refused with socket_ticket_expired or socket_ticket_invalid, never downgraded to Guest."
      - "Question Set and Room reference owning and hosting User ids instead of token hashes (initial Prisma migration)."
      - "Without Gmail credentials in development, verification and reset emails are written to the web server log."
    limitations:
      - "The verification notice is rendered on the home page only."
      - "A real Google consent-and-callback round trip was not verified; it is covered by an integration test with a stubbed Google token endpoint."
      - "Auth rate limiting uses Better Auth's in-memory store and is correct only for one web server process."
      - "Google OAuth redirect URIs for production are not configured; they belong to the Dokploy Deployment PRD (#11)."
      - "Setting GMAIL_USER without GMAIL_APP_PASSWORD (or the reverse) makes the mail sender throw 'GMAIL_USER and GMAIL_APP_PASSWORD must be set together'; the shared .env was in that state at one point."
      - "The browser does not parse the Game Server connect_error code with socketHandshakeErrorCodeSchema."
      - "The /admin Not allowed page returns HTTP 200."
