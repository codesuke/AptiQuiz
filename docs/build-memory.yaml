    working:
      - "Revealed Rounds carry cumulative standings with rank and movement (neutral after Round 1), ordered by score, correct-Answer response time, join time, then Participant ID."
      - "Returning Host and Participants receive the current standings and, after the Match, the final results from the host and join acknowledgements."
      - "The final advance commits one MatchResult per joined Participant, with the Room completion time, atomically; the Room is announced FINISHED only after the commit and a failed commit is retryable."
      - "Results record rank, score, accuracy over all Room Questions, mean Effective Response Time over accepted Answers (null when none), per-Topic correct/total, User id, verification at completion, and the Participant's College."
