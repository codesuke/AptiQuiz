      - "db:seed exists but nothing runs it on deploy; that belongs to PRD #11."
      - "The authenticated redirect-and-return flow and the Continue to hosting link were not checked in a browser."
      - "Web tests read the built @aptiquiz/contracts dist; build contracts first on a fresh checkout."
