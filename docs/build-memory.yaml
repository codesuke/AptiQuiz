  - id: "2026-10-10-github-prd-5"
    changed_at: "2026-10-10"
    kind: "feature"
    title: "Live Rounds & Server-Authoritative Scoring"
    status: "working_with_limitations"
    summary: "A started Room plays its Question Set as server-timed Rounds: Participants answer once, the Game Server scores by server receipt time with bounded delay compensation, closes and reveals each Round once, and the Host advances until the Room finishes."
    areas:
      - "Game Server"
      - "Game Engine"
      - "contracts"
      - "web interface"
      - "database"
    working:
      - "Start opens Question 0 with an immutable server startsAt and a deadline 30 s later; every Participant gets the same Question and deadline over round:state, each with a stable option order and opaque option ids of their own; the Host sees the authored order."
      - "Browsers count down from server timestamps; join and host acknowledgements return the current Round so a reconnecting browser recovers it."
      - "round:answer accepts only a joined Participant's first valid Answer received at or before endsAt by server time (no grace); same-key retries return the original result; duplicate, late, malformed, wrong-Round, foreign-option, and non-Participant Answers get typed refusals and change nothing."
      - "Server-initiated latency:ping samples feed a 5-sample rolling median; scoring subtracts min(median/2, 100 ms) (0 without samples), clamps, floors to 100 ms, and awards 500 + floor(500 x (1 - ERT/duration)) for a correct Answer and 0 for a wrong or missing one."
      - "The Lobby shows the scoring and delay rules from server config; README documents the values."
      - "A Round closes once at the deadline or when every connected Participant has answered; each receiver then sees the correct option in their own ids, their result, and all Participants' Round points; later Answers cannot change anything."
      - "Only the Host advances after a reveal; each next Question gets a fresh deadline; repeated or retried advances cannot skip a Question or open two Rounds; after the last Question the Room is FINISHED (persisted) and every browser shows Match finished."
    limitations:
      - "Rounds, Answers, and scores live in Game Server memory and are lost on restart; Answers and Match results are not persisted (PRD #7)."
      - "No leaderboard, rank movement, final standings, or explanation in the reveal (PRD #7); after FINISHED, acknowledgements return round null."
      - "A client can inflate its own RTT by delaying ping acknowledgements; the 100 ms cap bounds the gain."
      - "Reconnect during a Round relies on rejoining with the same join key; Resume Tokens belong to PRD #6."
      - "A 50-Participant Match is not load-tested (PRD #10)."
      - "apps/web/.env holds production URLs and secrets; a local run must start the web app with the Apti-App/.env values or Room registration is refused as tampered."
