  - id: "2026-10-10-aptiquiz-monorepo-bootstrap"
    changed_at: "2026-10-10"
    version: "0.1.0"
    kind: "feature"
    title: "Bootstrap the AptiQuiz application architecture"
    status: "working"
    summary: "Bootstrapped a pnpm/Turborepo TypeScript workspace with a Next.js web app, long-running Socket.IO Game Server, shared runtime contracts, a pure Game Engine, Prisma/PostgreSQL schema, and a repeatable connection simulator."
    areas:
      - "workspace and developer tooling"
      - "web application"
      - "realtime game server"
      - "game engine"
      - "database schema"
      - "load simulation"
      - "project documentation"
    working:
      - "The Next.js app builds, starts, serves the AptiQuiz foundation page, and returns a web health response."
      - "The Socket.IO Game Server builds, starts, returns an HTTP health response, and validates typed time-ping messages."
      - "The Game Engine enforces the initial Room phase transitions and provisional speed-scoring formula through a pure interface."
      - "Prisma ORM 7 validates and generates a client for the initial PostgreSQL schema."
      - "The simulator connected 50 of 50 local WebSocket clients and completed typed time-ping acknowledgements."
      - "Biome, strict TypeScript, Vitest, and production builds run from commands in Apti-App."
    limitations:
      - "Room creation, joining, live answers, reveal, Leaderboard, reconnection, and Question Set authoring are not implemented."
      - "The simulator proves 50 concurrent connections, not a complete 50-Participant match."
      - "Better Auth, Socket Tickets, Dokploy deployment, Redis, and Kafka are accepted or deferred architecture only; none is implemented."
      - "Active Rooms would be lost when the single Game Server process restarts."
