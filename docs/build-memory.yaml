    changed_at: "2026-10-10"
    kind: "feature"
    title: "50-Participant Simulator & Proof"
    status: "working_with_limitations"
    summary: "pnpm simulate now plays a complete starter Match with 50 virtual Participants through the public Socket.IO interface and checks gameplay, secrecy, resume, Leaderboard, and result invariants. One run passed against the deployed servers."
    areas:
      - "simulator"
      - "verification"
      - "documentation"
    working:
      - "The simulator creates a starter Room through the web app as a signed-in Host (or uses a supplied Room and Host ticket), joins 1 to 50 Guests, and exits nonzero on any failure or timeout."
      - "Cohorts submit correct, wrong, new-key duplicate, exact-key replay, and late Answers; revealed points, score tables, and Question content are checked against the starter fixture."
      - "Every pre-reveal payload is scanned for correctness, explanation, or points."
      - "A subset resumes mid-Round and keeps identity, score, Answer state, option order, and deadline."
