    changed_at: "2026-10-10"
    kind: "feature"
    title: "Leaderboard & Final Results"
    status: "working_with_limitations"
    summary: "After each revealed Round the Host and Participants see the same server-ranked Leaderboard with rank movement; after the last Round the Game Server saves one MatchResult per Participant in one transaction and then shows final results."
