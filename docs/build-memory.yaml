  - id: "2026-10-10-github-prd-6"
    changed_at: "2026-10-10"
    kind: "feature"
    title: "Reconnection & Resume"
    status: "working_with_limitations"
    summary: "A Guest or signed-in Participant who refreshes or loses the connection resumes the same Participant with a Resume Token, in the Lobby or during a Round, without changing the Room for anyone else."
    areas:
      - "Game Server"
      - "contracts"
      - "web interface"
      - "database"
    working:
      - "Joining returns an opaque Resume Token only to the joiner; the server keeps only its SHA-256 hash (memory and Participant.resumeTokenHash); the browser keeps it in localStorage per Join Code."
      - "room:resume reclaims the same Participant on a new connection and returns the phase, roster, current Round in the Participant's own option order with their locked Answer, the server deadline, and the revealed score; it adds no Participant, uses no place, and broadcasts nothing."
      - "A User's token works only for that User; malformed, unknown, and other-Room tokens get invalid_resume_token without disclosure; a display name or Join Code cannot reclaim a Participant; repeated resumes change nothing."
      - "A Participant whose last socket drops during an open Round counts as connected for early closure for 5 s, so a refresh does not end the Question for everyone; the deadline never moves."
      - "The browser resumes on every connect before going online, retries a lost acknowledgement at most 5 times, and shows a live Score from each reveal."
    limitations:
      - "A signed-in Participant whose session lapses reconnects as a Guest, is refused, and loses the token."
      - "Tokens stay in localStorage after the Room finishes."
      - "Live Rooms are memory-only; a Game Server restart loses them and the stored token hash is not yet used for recovery."
      - "The reconnect grace covers only the Question during which the drop happened."
