    limitations:
      - "One Room only; many Rooms, more than 50 Participants, restart recovery, and browser load are untested."
      - "Late Answers are rejected as round_not_open because the deadline timer closes the Round first; answer_too_late is not exercised."
      - "Server hardware for the deployed run is not visible to the runner and is not recorded."
